services:
  db:
    image: postgres:16-alpine
    container_name: warranty-management-base-db
    env_file:
      - path: .env.development
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warranty_management_base}
      POSTGRES_USER: ${POSTGRES_USER:-warranty_management_base_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warranty_management_base_password}
    ports:
      - "${DEV_DB_PORT:-15432}:5432"
    volumes:
      - warranty_management_base_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: warranty-management-base-redis
    env_file:
      - path: .env.development
        required: false
    command: redis-server --requirepass ${REDIS_PASSWORD:-warranty_management_base_redis_password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-warranty_management_base_redis_password}
    ports:
      - "${REDIS_DB_PORT:-16379}:6379"
    volumes:
      - warranty_management_base_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD:-warranty_management_base_redis_password}" ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: warranty-management-base-minio
    env_file:
      - path: .env.development
        required: false
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - warranty_management_base_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: warranty-management-base-minio-init
    env_file:
      - path: .env.development
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set minio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing "minio/$${MINIO_BUCKET_PUBLIC}" &&
        mc mb --ignore-existing "minio/$${MINIO_BUCKET_PRIVATE}" &&
        mc mb --ignore-existing "minio/$${MINIO_BUCKET_TEMP}" &&
        (mc ilm rule rm --all --force "minio/$${MINIO_BUCKET_TEMP}" || true) &&
        mc ilm rule add "minio/$${MINIO_BUCKET_TEMP}" --expire-days "$${MINIO_TEMP_RETENTION_DAYS:-7}" &&
        mc anonymous set download "minio/$${MINIO_BUCKET_PUBLIC}"
    depends_on:
      minio:
        condition: service_started

  pdf-renderer:
    build:
      context: .
      dockerfile: apps/api-pdf-renderer/Dockerfile
      target: runner
    container_name: warranty-management-base-pdf-renderer
    environment:
      PORT: 3001
      PDF_MAX_BODY_BYTES: ${PDF_MAX_BODY_BYTES:-10485760}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-45000}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${PDF_RENDERER_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:3001/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: warranty-management-base-api
    env_file:
      - path: .env.development
        required: false
    environment:
      NODE_ENV: development
      PORT: 4100
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      PDF_RENDERER_URL: http://pdf-renderer:3001
      DATABASE_URL: postgresql://${DB_USER:-warranty_management_base_user}:${DB_PASSWORD:-warranty_management_base_password}@db:5432/${DB_NAME:-warranty_management_base}?schema=${DB_SCHEMA:-public}
      REDIS_URL: redis://:${REDIS_PASSWORD:-warranty_management_base_redis_password}@redis:6379
    ports:
      - "${API_PORT:-4100}:4100"
    volumes:
      - .:/app
      - warranty_management_base_node_modules:/app/node_modules
      - warranty_management_base_api_node_modules:/app/apps/api/node_modules
      - warranty_management_base_shared_node_modules:/app/packages/shared/node_modules
      - ./storage:/app/storage
    command: sh -lc "pnpm install --frozen-lockfile && pnpm --filter @repo/api start:dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      pdf-renderer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:4100/health/live'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  warranty_management_base_postgres_data:
  warranty_management_base_redis_data:
  warranty_management_base_minio_data:
  warranty_management_base_node_modules:
  warranty_management_base_api_node_modules:
  warranty_management_base_shared_node_modules:
