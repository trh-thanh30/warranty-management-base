name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:packages
      - run: pnpm typecheck:packages
      - run: pnpm build:packages

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:api
      - run: pnpm typecheck:api
      - run: pnpm test:api
      - run: pnpm build:api

  pdf-renderer:
    name: PDF Renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:pdf-renderer
      - run: pnpm typecheck:pdf-renderer
      - run: pnpm test:pdf-renderer
      - run: pnpm build:pdf-renderer

  pdf-renderer-chromium:
    name: PDF Renderer Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pdf-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production PDF renderer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-pdf-renderer/Dockerfile
          target: runner
          load: true
          pull: true
          no-cache-filters: runner
          tags: warranty-management-base-api-pdf-renderer:ci
          cache-from: type=gha,scope=api-pdf-renderer-ci
          cache-to: type=gha,mode=max,scope=api-pdf-renderer-ci
      - name: Verify non-root runtime user
        run: |
          test "$(docker image inspect warranty-management-base-api-pdf-renderer:ci --format '{{.Config.User}}')" = "pdf"
      - name: Start bounded PDF renderer container
        run: |
          docker run --detach \
            --name pdf-renderer-acceptance \
            --cpus 2 \
            --memory 2g \
            --pids-limit 256 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --publish 127.0.0.1:3001:3001 \
            warranty-management-base-api-pdf-renderer:ci
      - name: Wait for renderer health check
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect pdf-renderer-acceptance --format '{{.State.Health.Status}}')"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs pdf-renderer-acceptance
              exit 1
            fi
            sleep 2
          done
          docker logs pdf-renderer-acceptance
          exit 1
      - name: Render real aggregate warranty certificates
        run: pnpm --filter @repo/api test -- warranty-certificate-pdf.service.spec.ts --runInBand
        env:
          PDF_RENDERER_URL: http://127.0.0.1:3001
          PDF_TEST_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/pdf-renderer
          RUN_PDF_RENDERER_INTEGRATION: "true"
      - name: Collect renderer diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/pdf-renderer
          docker logs pdf-renderer-acceptance > artifacts/pdf-renderer/container.log 2>&1 || true
          docker inspect pdf-renderer-acceptance > artifacts/pdf-renderer/container.json 2>&1 || true
      - name: Upload renderer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-renderer-acceptance-diagnostics
          path: artifacts/pdf-renderer
          if-no-files-found: warn
      - name: Stop renderer container
        if: always()
        run: docker rm --force pdf-renderer-acceptance || true

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:admin
      - run: pnpm typecheck:admin
      - run: pnpm test:admin
      - run: pnpm build:admin

  notify:
    name: Send Webhook Notification
    runs-on: ubuntu-latest
    needs:
      - packages
      - api
      - pdf-renderer
      - pdf-renderer-chromium
      - web
      - admin
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send CI notification
        if: always()
        env:
          CI_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          CI_TELEGRAM_CHAT_ID: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          CI_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
          CI_NEEDS_JSON: ${{ toJson(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CI_TELEGRAM_BOT_TOKEN" ] || [ -z "$CI_TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          JOBS_JSON_PATH="$RUNNER_TEMP/jobs.json"
          JOB_TOTALS_PATH="$RUNNER_TEMP/job-totals.json"
          export JOBS_JSON_PATH JOB_TOTALS_PATH
          node .github/scripts/collect-github-actions-jobs.mjs

          JOBS_JSON="$(cat "$JOBS_JSON_PATH")"
          PASSED="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).success)" "$JOB_TOTALS_PATH")"
          FAILED="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).failed)" "$JOB_TOTALS_PATH")"
          RUNNING="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).running)" "$JOB_TOTALS_PATH")"
          CANCELLED="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).cancelled)" "$JOB_TOTALS_PATH")"

          STATUS="$(node -e "const needs = JSON.parse(process.env.CI_NEEDS_JSON); const results = Object.values(needs).map((job) => job.result); if (results.includes('failure')) console.log('failed'); else if (results.includes('cancelled') || results.includes('skipped')) console.log('cancelled'); else console.log('success');")"

          pnpm notify:telegram \
            --event ci \
            --status "$STATUS" \
            --mode text \
            --project "${{ github.event.repository.name }}" \
            --environment ci \
            --branch "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --message "$CI_COMMIT_MESSAGE" \
            --author "${{ github.actor }}" \
            --workflow "${{ github.workflow }}" \
            --job "Packages, API, PDF Renderer, Web, Admin" \
            --jobs-json "$JOBS_JSON" \
            --passed "$PASSED" \
            --failed "$FAILED" \
            --running "$RUNNING" \
            --cancelled "$CANCELLED" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
