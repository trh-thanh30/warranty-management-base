name: Publish Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag to publish. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image-prefix: ${{ steps.metadata.outputs.image_prefix }}
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      api-image: ${{ steps.metadata.outputs.api_image }}
      web-image: ${{ steps.metadata.outputs.web_image }}
      admin-image: ${{ steps.metadata.outputs.admin_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image metadata
        id: metadata
        env:
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu

          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_prefix="$(printf '%s' "$image_prefix" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$DISPATCH_IMAGE_TAG" ]; then
            image_tag="$DISPATCH_IMAGE_TAG"
          elif [ -n "$WORKFLOW_RUN_SHA" ]; then
            image_tag="$WORKFLOW_RUN_SHA"
          else
            image_tag="$GITHUB_SHA"
          fi

          echo "image_prefix=$image_prefix" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "api_image=$image_prefix-api" >> "$GITHUB_OUTPUT"
          echo "web_image=$image_prefix-web" >> "$GITHUB_OUTPUT"
          echo "admin_image=$image_prefix-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.metadata.outputs.api_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.api_image }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.web_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.web_image }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.admin_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.admin_image }}:main
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  notify:
    name: Send Publish Notification
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ always() && needs.publish.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send publish notification
        env:
          CI_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          CI_TELEGRAM_CHAT_ID: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -eu

          if [ -z "$CI_TELEGRAM_BOT_TOKEN" ] || [ -z "$CI_TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          status="success"
          if [ "$PUBLISH_RESULT" = "failure" ]; then
            status="failed"
          elif [ "$PUBLISH_RESULT" = "cancelled" ]; then
            status="cancelled"
          fi

          pnpm notify:telegram \
            --event deploy \
            --status "$status" \
            --mode text \
            --project "${{ github.event.repository.name }}" \
            --environment registry \
            --branch "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --commit "${{ needs.publish.outputs.image-tag }}" \
            --message "Images pushed: api, web, admin" \
            --author "${{ github.actor }}" \
            --workflow "${{ github.workflow }}" \
            --job "Build and Push Images" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
