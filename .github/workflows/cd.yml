name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment.
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      deploy:
        description: Run the SSH Docker Compose deploy job after pushing images.
        required: true
        type: boolean
        default: false
      image_tag:
        description: Optional image tag to deploy. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image-prefix: ${{ steps.metadata.outputs.image_prefix }}
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      api-image: ${{ steps.metadata.outputs.api_image }}
      web-image: ${{ steps.metadata.outputs.web_image }}
      admin-image: ${{ steps.metadata.outputs.admin_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image metadata
        id: metadata
        env:
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu

          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_prefix="$(printf '%s' "$image_prefix" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$DISPATCH_IMAGE_TAG" ]; then
            image_tag="$DISPATCH_IMAGE_TAG"
          elif [ -n "$WORKFLOW_RUN_SHA" ]; then
            image_tag="$WORKFLOW_RUN_SHA"
          else
            image_tag="$GITHUB_SHA"
          fi

          echo "image_prefix=$image_prefix" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "api_image=$image_prefix-api" >> "$GITHUB_OUTPUT"
          echo "web_image=$image_prefix-web" >> "$GITHUB_OUTPUT"
          echo "admin_image=$image_prefix-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.metadata.outputs.api_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.api_image }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.web_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.web_image }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.admin_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.admin_image }}:main
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "$(eval "printf '%s' \"\${$name:-}\"")" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing deployment secrets:$missing"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api-image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web-image }}
          ADMIN_IMAGE: ${{ needs.build-and-push.outputs.admin-image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: API_IMAGE,WEB_IMAGE,ADMIN_IMAGE,IMAGE_TAG
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"

            mkdir -p .deploy
            if [ -f .env.production ]; then
              current_tag="$(grep -E '^IMAGE_TAG=' .env.production | tail -1 | cut -d '=' -f 2- || true)"
              if [ -n "$current_tag" ]; then
                printf '%s\n' "$current_tag" > .deploy/previous-image-tag
              fi
            fi

            if grep -qE '^API_IMAGE=' .env.production; then
              sed -i "s#^API_IMAGE=.*#API_IMAGE=$API_IMAGE#" .env.production
            else
              printf '\nAPI_IMAGE=%s\n' "$API_IMAGE" >> .env.production
            fi

            if grep -qE '^WEB_IMAGE=' .env.production; then
              sed -i "s#^WEB_IMAGE=.*#WEB_IMAGE=$WEB_IMAGE#" .env.production
            else
              printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE" >> .env.production
            fi

            if grep -qE '^ADMIN_IMAGE=' .env.production; then
              sed -i "s#^ADMIN_IMAGE=.*#ADMIN_IMAGE=$ADMIN_IMAGE#" .env.production
            else
              printf 'ADMIN_IMAGE=%s\n' "$ADMIN_IMAGE" >> .env.production
            fi

            if grep -qE '^IMAGE_TAG=' .env.production; then
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=$IMAGE_TAG#" .env.production
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env.production
            fi

            docker compose -f docker-compose.prod.yml --env-file .env.production pull api worker-email web admin
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker compose -f docker-compose.prod.yml --env-file .env.production ps

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    steps:
      - name: Check deployment endpoints
        env:
          DEPLOY_API_HEALTH_URL: ${{ secrets.DEPLOY_API_HEALTH_URL }}
          DEPLOY_WEB_URL: ${{ secrets.DEPLOY_WEB_URL }}
          DEPLOY_ADMIN_URL: ${{ secrets.DEPLOY_ADMIN_URL }}
        run: |
          set -eu

          checked=0

          if [ -n "$DEPLOY_API_HEALTH_URL" ]; then
            curl --fail --show-error --silent --location "$DEPLOY_API_HEALTH_URL" > /dev/null
            checked=$((checked + 1))
          fi

          if [ -n "$DEPLOY_WEB_URL" ]; then
            curl --fail --show-error --silent --location "$DEPLOY_WEB_URL" > /dev/null
            checked=$((checked + 1))
          fi

          if [ -n "$DEPLOY_ADMIN_URL" ]; then
            curl --fail --show-error --silent --location "$DEPLOY_ADMIN_URL" > /dev/null
            checked=$((checked + 1))
          fi

          if [ "$checked" -eq 0 ]; then
            echo "No deployment endpoint secrets configured. Skipping health check."
          fi

  notify:
    name: Send Deploy Notification
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - deploy
      - health-check
    if: ${{ always() && (needs.build-and-push.result != 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send CD notification
        env:
          CI_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          CI_TELEGRAM_CHAT_ID: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HEALTH_CHECK_RESULT: ${{ needs.health-check.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          set -eu

          if [ -z "$CI_TELEGRAM_BOT_TOKEN" ] || [ -z "$CI_TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          status="success"
          if [ "$BUILD_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ] || [ "$HEALTH_CHECK_RESULT" = "failure" ]; then
            status="failed"
          elif [ "$BUILD_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ] || [ "$HEALTH_CHECK_RESULT" = "cancelled" ]; then
            status="cancelled"
          fi

          pnpm notify:telegram \
            --event deploy \
            --status "$status" \
            --mode text \
            --project "${{ github.event.repository.name }}" \
            --environment "${{ inputs.environment || 'registry' }}" \
            --branch "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --commit "${{ needs.build-and-push.outputs.image-tag }}" \
            --message "Images pushed: api, web, admin" \
            --author "${{ github.actor }}" \
            --workflow "${{ github.workflow }}" \
            --job "Build images${{ inputs.deploy && ', Deploy' || '' }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
