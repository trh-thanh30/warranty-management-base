name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy, usually a commit SHA already published to GHCR.
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    environment: production
    outputs:
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      api-image: ${{ steps.metadata.outputs.api_image }}
      pdf-renderer-image: ${{ steps.metadata.outputs.pdf_renderer_image }}
      migrator-image: ${{ steps.metadata.outputs.migrator_image }}
      web-image: ${{ steps.metadata.outputs.web_image }}
      admin-image: ${{ steps.metadata.outputs.admin_image }}
      deployment-environment: ${{ steps.metadata.outputs.deployment_environment }}
      source-branch: ${{ steps.metadata.outputs.source_branch }}
    steps:
      - name: Resolve image metadata
        id: metadata
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu

          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_prefix="$(printf '%s' "$image_prefix" | tr '[:upper:]' '[:lower:]')"
          image_tag="$MANUAL_IMAGE_TAG"
          source_branch="$GITHUB_REF_NAME"

          if [ -z "$image_tag" ]; then
            echo "Unable to resolve the published image tag."
            exit 1
          fi

          deployment_environment="production"

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "deployment_environment=$deployment_environment" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "api_image=$image_prefix-api" >> "$GITHUB_OUTPUT"
          echo "pdf_renderer_image=$image_prefix-api-pdf-renderer" >> "$GITHUB_OUTPUT"
          echo "migrator_image=$image_prefix-api-migrator" >> "$GITHUB_OUTPUT"
          echo "web_image=$image_prefix-web" >> "$GITHUB_OUTPUT"
          echo "admin_image=$image_prefix-admin" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "$(eval "printf '%s' \"\${$name:-}\"")" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing deployment secrets:$missing"
            exit 1
          fi

      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Synchronize production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          PDF_RENDERER_IMAGE: ${{ steps.metadata.outputs.pdf_renderer_image }}
          MIGRATOR_IMAGE: ${{ steps.metadata.outputs.migrator_image }}
          WEB_IMAGE: ${{ steps.metadata.outputs.web_image }}
          ADMIN_IMAGE: ${{ steps.metadata.outputs.admin_image }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: API_IMAGE,PDF_RENDERER_IMAGE,MIGRATOR_IMAGE,WEB_IMAGE,ADMIN_IMAGE,IMAGE_TAG
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"

            mkdir -p .deploy
            if [ -f .env.production ]; then
              current_tag="$(grep -E '^IMAGE_TAG=' .env.production | tail -1 | cut -d '=' -f 2- || true)"
              if [ -n "$current_tag" ]; then
                printf '%s\n' "$current_tag" > .deploy/previous-image-tag
              fi
            fi

            if grep -qE '^API_IMAGE=' .env.production; then
              sed -i "s#^API_IMAGE=.*#API_IMAGE=$API_IMAGE#" .env.production
            else
              printf '\nAPI_IMAGE=%s\n' "$API_IMAGE" >> .env.production
            fi

            if grep -qE '^MIGRATOR_IMAGE=' .env.production; then
              sed -i "s#^MIGRATOR_IMAGE=.*#MIGRATOR_IMAGE=$MIGRATOR_IMAGE#" .env.production
            else
              printf 'MIGRATOR_IMAGE=%s\n' "$MIGRATOR_IMAGE" >> .env.production
            fi

            if grep -qE '^PDF_RENDERER_IMAGE=' .env.production; then
              sed -i "s#^PDF_RENDERER_IMAGE=.*#PDF_RENDERER_IMAGE=$PDF_RENDERER_IMAGE#" .env.production
            else
              printf 'PDF_RENDERER_IMAGE=%s\n' "$PDF_RENDERER_IMAGE" >> .env.production
            fi

            if grep -qE '^WEB_IMAGE=' .env.production; then
              sed -i "s#^WEB_IMAGE=.*#WEB_IMAGE=$WEB_IMAGE#" .env.production
            else
              printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE" >> .env.production
            fi

            if grep -qE '^ADMIN_IMAGE=' .env.production; then
              sed -i "s#^ADMIN_IMAGE=.*#ADMIN_IMAGE=$ADMIN_IMAGE#" .env.production
            else
              printf 'ADMIN_IMAGE=%s\n' "$ADMIN_IMAGE" >> .env.production
            fi

            if grep -qE '^IMAGE_TAG=' .env.production; then
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=$IMAGE_TAG#" .env.production
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env.production
            fi

            if ! docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools config --services | grep -qx migrate; then
              echo "The synchronized production Compose file does not define the migrate service."
              exit 1
            fi

            docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools pull migrate pdf-renderer api worker-email web admin
            docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools run --rm migrate
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm minio-init
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker compose -f docker-compose.prod.yml --env-file .env.production ps

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment: ${{ needs.deploy.outputs.deployment-environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment endpoints
        env:
          DEPLOY_API_HEALTH_URL: ${{ secrets.DEPLOY_API_HEALTH_URL }}
          DEPLOY_WEB_URL: ${{ secrets.DEPLOY_WEB_URL }}
          DEPLOY_ADMIN_URL: ${{ secrets.DEPLOY_ADMIN_URL }}
        run: bash scripts/check-deployment-endpoints.sh

  cleanup-images:
    name: Clean Up Previous Application Images
    runs-on: ubuntu-latest
    needs:
      - deploy
      - health-check
    environment: ${{ needs.deploy.outputs.deployment-environment }}
    steps:
      - name: Remove stale project images over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.deploy.outputs.api-image }}
          PDF_RENDERER_IMAGE: ${{ needs.deploy.outputs.pdf-renderer-image }}
          MIGRATOR_IMAGE: ${{ needs.deploy.outputs.migrator-image }}
          WEB_IMAGE: ${{ needs.deploy.outputs.web-image }}
          ADMIN_IMAGE: ${{ needs.deploy.outputs.admin-image }}
          IMAGE_TAG: ${{ needs.deploy.outputs.image-tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: API_IMAGE,PDF_RENDERER_IMAGE,MIGRATOR_IMAGE,WEB_IMAGE,ADMIN_IMAGE,IMAGE_TAG
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"

            for value in "$API_IMAGE" "$PDF_RENDERER_IMAGE" "$MIGRATOR_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE" "$IMAGE_TAG"; do
              if [ -z "$value" ]; then
                echo "Required image cleanup metadata is missing."
                exit 1
              fi
            done

            previous_tag=""
            if [ -f .deploy/previous-image-tag ]; then
              previous_tag="$(tr -d '\r\n' < .deploy/previous-image-tag)"
            fi

            echo "Keeping current image tag: $IMAGE_TAG"
            if [ -n "$previous_tag" ]; then
              echo "Keeping rollback image tag: $previous_tag"
            fi

            for repository in "$API_IMAGE" "$PDF_RENDERER_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE"; do
              docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' |
              while IFS= read -r image; do
                [ -z "$image" ] && continue
                [ "$image" = "$repository:<none>" ] && continue
                [ "$image" = "$repository:$IMAGE_TAG" ] && continue

                if [ -n "$previous_tag" ]; then
                  [ "$image" = "$repository:$previous_tag" ] && continue
                fi

                if docker image rm "$image"; then
                  echo "Removed stale project image: $image"
                else
                  echo "Kept image still referenced by a container: $image"
                fi
              done
            done

            docker image ls "$MIGRATOR_IMAGE" --format '{{.Repository}}:{{.Tag}}' |
            while IFS= read -r image; do
              [ -z "$image" ] && continue
              [ "$image" = "$MIGRATOR_IMAGE:<none>" ] && continue

              if docker image rm "$image"; then
                echo "Removed disposable migrator image: $image"
              else
                echo "Kept migrator image still referenced by a container: $image"
              fi
            done

            for repository in "$API_IMAGE" "$PDF_RENDERER_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE"; do
              docker image ls "$repository" \
                --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
            done

  notify:
    name: Send Deploy Notification
    runs-on: ubuntu-latest
    needs:
      - deploy
      - health-check
      - cleanup-images
    if: >-
      ${{
        always() &&
        github.ref_name == 'main' &&
        needs.deploy.result != 'skipped'
      }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send deploy notification
        env:
          CI_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          CI_TELEGRAM_CHAT_ID: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HEALTH_CHECK_RESULT: ${{ needs.health-check.result }}
          CLEANUP_RESULT: ${{ needs.cleanup-images.result }}
        run: |
          set -eu

          if [ -z "$CI_TELEGRAM_BOT_TOKEN" ] || [ -z "$CI_TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          status="success"
          if [ "$DEPLOY_RESULT" = "failure" ] || [ "$HEALTH_CHECK_RESULT" = "failure" ] || [ "$CLEANUP_RESULT" = "failure" ]; then
            status="failed"
          elif [ "$DEPLOY_RESULT" = "cancelled" ] || [ "$HEALTH_CHECK_RESULT" = "cancelled" ] || [ "$CLEANUP_RESULT" = "cancelled" ]; then
            status="cancelled"
          fi

          pnpm notify:telegram \
            --event deploy \
            --status "$status" \
            --mode text \
            --project "${{ github.event.repository.name }}" \
            --environment "${{ needs.deploy.outputs.deployment-environment }}" \
            --branch "${{ needs.deploy.outputs.source-branch }}" \
            --repository "${{ github.repository }}" \
            --commit "${{ needs.deploy.outputs.image-tag }}" \
            --message "Deployed image tag ${{ needs.deploy.outputs.image-tag }}" \
            --author "${{ github.actor }}" \
            --workflow "${{ github.workflow }}" \
            --job "Deploy, Health Check, Image Cleanup" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
