<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warranty Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#172033",
              muted: "#5d6678",
              line: "#d9e0ea",
              canvas: "#f6f8fb",
              panel: "#ffffff",
              accent: "#2563eb",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .prose-docs {
          @apply max-w-none text-base leading-7 text-ink;
        }

        .prose-docs h1 {
          @apply mb-4 mt-0 text-3xl font-semibold tracking-tight;
        }

        .prose-docs h2 {
          @apply mb-3 mt-9 border-b border-line pb-2 text-2xl font-semibold tracking-tight;
        }

        .prose-docs h3 {
          @apply mb-2 mt-7 text-xl font-semibold;
        }

        .prose-docs h4 {
          @apply mb-2 mt-6 text-lg font-semibold;
        }

        .prose-docs p {
          @apply my-4 max-w-3xl text-muted;
        }

        .prose-docs ul {
          @apply my-4 max-w-3xl list-disc space-y-2 pl-6 text-muted;
        }

        .prose-docs strong {
          @apply font-semibold text-ink;
        }

        .prose-docs a {
          @apply font-medium text-accent underline underline-offset-4;
        }

        .prose-docs code {
          @apply rounded border border-line bg-white px-1.5 py-0.5 text-sm text-ink;
        }

        .prose-docs pre {
          @apply my-5 overflow-x-auto rounded-md border border-line bg-slate-950 p-4 text-sm leading-6 text-slate-100;
        }

        .prose-docs pre code {
          @apply border-0 bg-transparent p-0 text-slate-100;
        }
      }
    </style>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div class="min-h-screen lg:grid lg:grid-cols-[280px_1fr]">
      <aside class="border-b border-line bg-panel/95 shadow-sm lg:sticky lg:top-0 lg:h-screen lg:border-b-0 lg:border-r">
        <div class="border-b border-line px-5 py-5">
          <a class="group inline-flex min-h-11 items-center gap-3 rounded-md text-xl font-semibold tracking-tight focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2" href="#overview">
            <span class="grid size-10 place-items-center rounded-md bg-slate-950 text-sm font-bold text-white shadow-sm transition group-hover:bg-accent">WD</span>
            <span>Warranty Docs</span>
          </a>
          <p class="mt-2 text-sm leading-6 text-muted">
            Tài liệu module để frontend đọc nhanh contract, flow và quy ước tích hợp.
          </p>
        </div>
        <div class="px-5 py-4">
          <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-500">Modules</p>
          <nav class="flex gap-2 overflow-x-auto pb-1 lg:block lg:space-y-2 lg:overflow-visible lg:pb-0" id="module-nav" aria-label="Docs modules"></nav>
        </div>
      </aside>

      <main class="mx-auto w-full max-w-5xl px-5 py-6 sm:px-8 lg:px-10 lg:py-10">
        <header class="mb-8 border-b border-line pb-6">
          <p class="text-sm font-medium uppercase tracking-wide text-accent">Static module docs</p>
          <h1 class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl" id="doc-title">Đang tải tài liệu</h1>
          <p class="mt-3 max-w-3xl text-base leading-7 text-muted" id="doc-description">
            Chọn một module ở sidebar để xem nội dung markdown được render trực tiếp.
          </p>
        </header>

        <article class="prose-docs" id="doc-content" aria-live="polite">
          <div class="rounded-md border border-line bg-panel p-5 text-muted">Đang tải...</div>
        </article>
      </main>
    </div>

    <template id="error-template">
      <section class="rounded-md border border-red-200 bg-red-50 p-5 text-red-900">
        Không đọc được file markdown. Kiểm tra lại file trong <code>apps/docs/public/content</code>.
      </section>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
